# ── Demo profile ─────────────────────────────────────────────────────────────────
# Activated via SPRING_PROFILES_ACTIVE=demo (Render deploy, Phase 7.5)
# Adds profile-gated Flyway migration location for demo seed data (decision D5)

spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Logging: keep INFO in demo so Render log viewer is readable
logging.level.com.ledgerbridge=INFO

# Kafka is disabled in demo — no free managed Kafka tier available (Upstash and
# CloudKarafka both deprecated in 2024-2025). KafkaConfig, TransactionEventProducer,
# and TransactionRiskConsumer are all @Profile("!demo") so none of their beans are
# created. Excluding KafkaAutoConfiguration prevents Spring from trying to connect
# to a broker on startup. The risk engine pipeline runs in full locally via Docker Compose.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
