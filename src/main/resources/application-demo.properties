# ── Demo profile ─────────────────────────────────────────────────────────────────
# Activated via SPRING_PROFILES_ACTIVE=demo (Render deploy, Phase 7.5)
# Adds profile-gated Flyway migration location for demo seed data (decision D5)

spring.flyway.locations=classpath:db/migration,classpath:db/demo

# Logging: keep INFO in demo so Render log viewer is readable
logging.level.com.ledgerbridge=INFO

# Kafka consumer-group prefix distinguishes demo from local dev on shared brokers
spring.kafka.consumer.group-id=ledgerbridge-demo
