# ── Application ────────────────────────────────────────────────────────────────
spring.application.name=ledgerbridge
server.port=8080

# Enable virtual threads (Java 21 + Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# ── Database ────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerbridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledgerbridge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledgerbridge}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────────
# none until Phase 1 migrations exist; switch to validate after V1–V6 land
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ──────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Kafka ────────────────────────────────────────────────────────────────────────
# Default port 9094 = Kafka external listener in docker-compose (host access)
# In Docker Compose api service: override with kafka:9092 (internal listener)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=ledgerbridge-risk-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ledgerbridge.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ── Actuator ─────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
# Liveness and readiness probes — Railway health check uses /actuator/health/liveness (decision D7)
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ── SpringDoc / Swagger UI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
# Exclude actuator from API docs (keep Swagger UI focused on the app API)
springdoc.paths-to-exclude=/actuator/**

# ── JWT ──────────────────────────────────────────────────────────────────────────
# WARNING: JWT_SECRET must be set to a secure random 256-bit (32-byte) value in production.
# For local dev without .env: the default below is intentionally weak and must not be used in prod.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-32chars-DO-NOT-USE-IN-PROD}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ── Logging ───────────────────────────────────────────────────────────────────────
# Production: JSON via logback-spring.xml (logstash-logback-encoder)
# Dev: human-readable pattern via logback-spring.xml springProfile="dev"
logging.level.root=INFO
logging.level.com.ledgerbridge=INFO
