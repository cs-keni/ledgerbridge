services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerbridge
      POSTGRES_USER: ledgerbridge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerbridge}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerbridge -d ledgerbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9094:9094"   # external listener — use localhost:9094 from your host machine
    environment:
      # KRaft (no ZooKeeper)
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # PLAINTEXT: container-to-container (kafka:9092)
      # EXTERNAL:  host-to-container     (localhost:9094)
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    # host.docker.internal lets Prometheus reach the Spring Boot app
    # running natively on the Docker host (standard local dev mode)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/risk-engine.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # ── api ─────────────────────────────────────────────────────────────────────
  # Uncomment in Phase 7.5 after the Dockerfile is written.
  # For local dev: run `docker-compose up -d db kafka prometheus grafana`
  # then `./mvnw spring-boot:run -Dspring-boot.run.profiles=dev`
  #
  # api:
  #   build: .
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ledgerbridge
  #     SPRING_DATASOURCE_USERNAME: ledgerbridge
  #     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     JWT_SECRET: ${JWT_SECRET}
  #     SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy

volumes:
  pgdata:
  prometheusdata:
  grafanadata:
