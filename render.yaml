services:
  - type: web
    name: ledgerbridge
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # ── Database — set in Render dashboard (Supabase direct connection) ──────
      # Use port 5432, NOT the PgBouncer pooler at 6543.
      # Flyway and JPA prepared statements require a direct connection.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # ── Auth ─────────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      # ── Kafka ────────────────────────────────────────────────────────────────
      # Kafka is disabled in demo profile (KafkaAutoConfiguration excluded).
      # The full Kafka pipeline runs locally via Docker Compose for demo recording.
      # No Kafka env vars needed here.
